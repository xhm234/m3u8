<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频转 MP3 - 在线转换</title>
    <style>
        /* 基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #fcfdfe;
            /* 模拟原图的网格背景 */
            background-image: 
                linear-gradient(#f2f6fb 1px, transparent 1px),
                linear-gradient(90deg, #f2f6fb 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 标题部分 */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 16px;
            color: #6b7280;
        }

        /* 主卡片 */
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            padding: 24px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        /* 文件列表 */
        #file-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 16px;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-name {
            font-size: 18px;
            font-weight: 500;
            color: #111827;
        }

        .file-meta {
            font-size: 14px;
            color: #9ca3af;
        }

        .remove-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
        }

        /* M4A提取卡片 (仅展示第一个文件) */
        .extract-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: #fff;
        }
        .extract-card:hover {
            background: #f9fafb;
        }

        .extract-text h3 {
            font-size: 15px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 2px;
        }

        .extract-text p {
            font-size: 13px;
            color: #9ca3af;
        }

        .extract-icon {
            color: #9ca3af;
            font-size: 18px;
        }

        /* 添加文件按钮 */
        .add-file-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 0;
            width: 100%;
        }
        .add-file-btn:hover {
            color: #4f46e5;
        }

        /* 选项区域 */
        .options-group {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .option-label {
            font-size: 15px;
            color: #6b7280;
            width: 50px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .select-btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #111827;
            transition: all 0.2s;
        }

        .select-btn.active {
            background: #4f73ff;
            color: #ffffff;
            border-color: #4f73ff;
        }

        .select-btn.bitrate.active {
            background: #f3f4f6;
            color: #111827;
            border-color: #f3f4f6;
        }

        /* 预估大小 */
        .estimated-size {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 4px;
            margin-left: 66px;
        }

        /* 转换按钮 */
        .convert-btn {
            background: #4f73ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }
        .convert-btn:hover {
            background: #3b5bdb;
        }
        .convert-btn:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        /* 底部状态 */
        .status-text {
            margin-top: 16px;
            color: #4f73ff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        /* 隐藏 input */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>视频转 MP3</h1>
        <p>转换直接在你的浏览器里完成，视频无需上传</p>
    </div>

    <div class="main-card">
        <!-- 文件列表区 -->
        <div id="file-list">
            <!-- 默认占位（匹配原图） -->
            <div class="file-item" id="default-file">
                <div class="file-header">
                    <div class="file-info">
                        <span class="file-name">3c对对对.mp4</span>
                        <span class="file-meta">383 MB · 26:02 · 立体声 · AAC</span>
                    </div>
                    <button class="remove-btn" onclick="removeFile(this)">✕</button>
                </div>
                <div class="extract-card">
                    <div class="extract-text">
                        <h3>提取原始音轨 (M4A)</h3>
                        <p>几秒完成，音质不变 · 23 MB</p>
                    </div>
                    <span class="extract-icon">›</span>
                </div>
            </div>
        </div>

        <!-- 隐藏的 input 用于多文件选择 -->
        <input type="file" id="file-input" multiple accept="video/*">
        
        <button class="add-file-btn" onclick="document.getElementById('file-input').click()">
            <span>+</span> 添加文件
        </button>

        <hr style="border: 0; border-top: 1px solid #f3f4f6; margin: 8px 0 20px 0;">

        <!-- 选项区 -->
        <div class="options-group">
            <div class="option-row">
                <span class="option-label">转换为</span>
                <div class="btn-group" id="format-group">
                    <button class="select-btn active" data-format="MP3">MP3</button>
                    <button class="select-btn" data-format="WAV">WAV</button>
                    <button class="select-btn" data-format="M4A">M4A</button>
                </div>
            </div>

            <div class="option-row">
                <span class="option-label">码率</span>
                <div class="btn-group" id="bitrate-group">
                    <button class="select-btn bitrate" data-bitrate="128k">128k</button>
                    <button class="select-btn bitrate active" data-bitrate="192k">192k</button>
                    <button class="select-btn bitrate" data-bitrate="320k">320k</button>
                </div>
            </div>
            
            <div class="estimated-size" id="estimated-size">约 36 MB</div>
        </div>

        <!-- 提交按钮 -->
        <button class="convert-btn" id="convert-btn" onclick="startConversion()">转换为 MP3</button>

        <!-- 状态提示 -->
        <div class="status-text" id="status-text" style="display: none;">
            🎵 已保存，可在浏览器的「下载内容」查看。
        </div>
    </div>
</div>

<script>
    let selectedFiles = [];

    // 初始化：如果用户清空了列表，恢复原图占位符
    function checkEmptyState() {
        const list = document.getElementById('file-list');
        if (list.children.length === 0) {
            list.innerHTML = `
                <div class="file-item" id="default-file">
                    <div class="file-header">
                        <div class="file-info">
                            <span class="file-name">3c对对对.mp4</span>
                            <span class="file-meta">383 MB · 26:02 · 立体声 · AAC</span>
                        </div>
                        <button class="remove-btn" onclick="removeFile(this)">✕</button>
                    </div>
                    <div class="extract-card">
                        <div class="extract-text">
                            <h3>提取原始音轨 (M4A)</h3>
                            <p>几秒完成，音质不变 · 23 MB</p>
                        </div>
                        <span class="extract-icon">›</span>
                    </div>
                </div>
            `;
        }
    }

    // 移除文件
    function removeFile(btn) {
        const fileItem = btn.closest('.file-item');
        fileItem.remove();
        checkEmptyState();
        updateConvertButton();
    }

    // 格式化文件大小
    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // 处理文件选择 (支持多选)
    document.getElementById('file-input').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const list = document.getElementById('file-list');
        
        // 如果当前只有默认占位符，先移除它
        const defaultFile = document.getElementById('default-file');
        if (defaultFile && list.children.length === 1) {
            defaultFile.remove();
        }

        files.forEach(file => {
            selectedFiles.push(file);
            
            // 创建 DOM
            const div = document.createElement('div');
            div.className = 'file-item';
            
            // 随机生成一个时长占位符
            const randomMins = Math.floor(Math.random() * 30) + 1;
            const randomSecs = Math.floor(Math.random() * 60).toString().padStart(2, '0');

            div.innerHTML = `
                <div class="file-header">
                    <div class="file-info">
                        <span class="file-name">${file.name}</span>
                        <span class="file-meta">${formatSize(file.size)} · ${randomMins}:${randomSecs} · 立体声 · AAC</span>
                    </div>
                    <button class="remove-btn" onclick="removeFile(this)">✕</button>
                </div>
            `;
            list.appendChild(div);
        });

        // 清空 input 以便可以重复上传同一个文件
        this.value = '';
        updateConvertButton();
    });

    // 格式和码率切换逻辑
    let currentFormat = 'MP3';
    let currentBitrate = '192k';

    document.querySelectorAll('#format-group .select-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#format-group .select-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentFormat = e.target.getAttribute('data-format');
            updateConvertButton();
        });
    });

    document.querySelectorAll('#bitrate-group .select-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#bitrate-group .select-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentBitrate = e.target.getAttribute('data-bitrate');
            
            // 模拟更新文件大小
            if (currentBitrate === '128k') document.getElementById('estimated-size').innerText = '约 24 MB';
            if (currentBitrate === '192k') document.getElementById('estimated-size').innerText = '约 36 MB';
            if (currentBitrate === '320k') document.getElementById('estimated-size').innerText = '约 60 MB';
            
            updateConvertButton();
        });
    });

    // 更新按钮文字
    function updateConvertButton() {
        const btn = document.getElementById('convert-btn');
        btn.innerText = `转换为 ${currentFormat}`;
        // 隐藏状态提示
        document.getElementById('status-text').style.display = 'none';
    }

    // 模拟转换过程
    function startConversion() {
        const btn = document.getElementById('convert-btn');
        const status = document.getElementById('status-text');
        
        // 检查是否有真实文件，如果没有则提示
        const realFilesCount = document.querySelectorAll('#file-list .file-item').length;
        if (realFilesCount === 0) {
            alert('请先添加要转换的文件！');
            return;
        }

        // UI 状态改变
        btn.disabled = true;
        btn.innerText = '转换中...';
        status.style.display = 'none';

        setTimeout(() => {
            // 模拟转换完成，触发下载
            const content = "这是一个测试生成的音频文件。\n由于浏览器纯前端限制，真实转换需引入 ffmpeg.wasm 库。\n此文件用于验证下载交互。";
            const blob = new Blob([content], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `转换测试_${new Date().getTime()}.${currentFormat.toLowerCase()}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // 恢复 UI
            btn.disabled = false;
            updateConvertButton();
            status.style.display = 'flex';
        }, 1500); // 1.5秒模拟转换时间
    }
</script>

</body>
</html>
