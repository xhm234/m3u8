<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M3U8 提取转MP3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#12121a;color:#eee;padding:12px;line-height:1.5}
.box{background:#1e1e2f;border-radius:10px;padding:14px;margin-bottom:12px}
h3{margin-bottom:10px;color:#7cf}
input,textarea,select,button{width:100%;padding:10px;border-radius:6px;border:0;font-size:15px;margin:6px 0}
input,textarea,select{background:#2b2b40;color:#fff}
button{background:#2584ff;color:#fff;font-weight:bold;cursor:pointer}
button.secondary{background:#444660}
button.danger{background:#c43}
.row{display:flex;gap:8px}
.row>*{flex:1}
pre{background:#0b0b16;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;color:#9cf;white-space:pre-wrap;word-break:break-all}
.tip{color:#aaa;font-size:13px;margin:4px 0}
.sliceItem{display:flex;align-items:center;gap:6px;padding:8px;background:#2b2b40;border-radius:6px;margin:4px 0}
.sliceItem>input{flex:0 0 40px}
.sliceItem>span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:10px;background:#2b2b40;border-radius:5px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:#2584ff;width:0%;transition:0.2s}
</style>
</head>
<body>
<div class="box">
<h3>模式选择</h3>
<select id="modeSel">
<option value="direct">方案A：直连（源站允许CORS）</option>
<option value="proxy">方案B：CORS代理</option>
</select>
<input id="proxyUrl" placeholder="代理地址，例：https://corsproxy.io/?url=" style="display:none">
</div>

<div class="box">
<h3>导入 M3U8</h3>
<textarea id="m3u8Raw" rows="7" placeholder="粘贴 m3u8 文本内容"></textarea>
<div class="row">
<button onclick="parseM3U8()">解析分片</button>
<button class="secondary" onclick="clearAll()">清除全部</button>
</div>
<div class="tip">勾选分片后，未勾选的会被过滤，只保留选中的音频分片</div>
</div>

<div class="box">
<h3>分片列表</h3>
<div id="sliceList"></div>
</div>

<div class="box">
<h3>转码输出</h3>
<div class="progress"><div id="progressBar"></div></div>
<div class="tip" id="statusTxt">等待解析</div>
<div class="row">
<button id="startBtn" onclick="startConvert()" disabled>开始转MP3</button>
<button class="secondary" onclick="downloadLog()">下载日志</button>
</div>
</div>

<script type="module">
import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/+esm';
import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm';

let ffmpeg = null;
let slices = [];
let logText = "";
const modeSel = document.getElementById("modeSel");
const proxyUrlEl = document.getElementById("proxyUrl");
const proxyWrap = (url)=>{
  if(modeSel.value !== "proxy") return url;
  const p = proxyUrlEl.value.trim();
  if(!p) return url;
  return p + encodeURIComponent(url);
};
modeSel.onchange = ()=>{
  proxyUrlEl.style.display = modeSel.value === "proxy" ? "block" : "none";
};
const rawEl = document.getElementById('m3u8Raw');
const sliceListEl = document.getElementById('sliceList');
const startBtn = document.getElementById("startBtn");
const progressBar = document.getElementById("progressBar");
const statusTxt = document.getElementById("statusTxt");

function log(msg){
  const t = new Date().toLocaleTimeString();
  const line = `[${t}] ${msg}\n`;
  logText += line;
  console.log(line);
  statusTxt.innerText = msg;
}

function parseM3U8(){
  const raw = rawEl.value.trim();
  if(!raw) return alert("请粘贴 m3u8 内容");
  slices = [];
  const lines = raw.split(/\r?\n/);
  let cur = null;
  for(const line of lines){
    const t = line.trim();
    if(!t) continue;
    if(t.startsWith("#")){
      if(t.startsWith("#EXTINF")) cur = {extinf:t,url:null};
      continue;
    }
    if(cur){
      cur.url = t;
      slices.push(cur);
      cur = null;
    }else{
      slices.push({extinf:null,url:t});
    }
  }
  renderSliceList();
  log(`解析完成，分片总数：${slices.length}`);
  startBtn.disabled = slices.length === 0;
}

function renderSliceList(){
  sliceListEl.innerHTML = "";
  slices.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = "sliceItem";
    div.innerHTML = `
      <input type="checkbox" data-idx="${i}" checked>
      <span title="${s.url}">${s.url}</span>
    `;
    sliceListEl.appendChild(div);
  })
}

function getSelectedSlices(){
  const selected = [];
  document.querySelectorAll('.sliceItem input:checked').forEach(cb=>{
    const idx = Number(cb.dataset.idx);
    selected.push(slices[idx]);
  })
  return selected;
}

async function loadFFmpeg(){
  if(ffmpeg) return ffmpeg;
  log("正在加载 FFmpeg wasm 引擎...");
  const baseURL = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
  const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript");
  const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm");
  ffmpeg = new FFmpeg();
  ffmpeg.on("log", ({message})=>log(message));
  ffmpeg.on("progress", ({progress})=>{
    const pct = Math.round(progress*100);
    progressBar.style.width = `${pct}%`;
  });
  await ffmpeg.load({coreURL,wasmURL});
  log("引擎加载成功");
  return ffmpeg;
}

async function startConvert(){
  const selected = getSelectedSlices();
  if(selected.length === 0) return alert("请至少勾选一个分片");
  startBtn.disabled = true;
  progressBar.style.width = "0%";
  logText = "";
  try{
    const ff = await loadFFmpeg();
    log(`开始下载分片，共${selected.length}段`);
    const fileList = [];
    for(let i=0;i<selected.length;i++){
      const s = selected[i];
      const u = proxyWrap(s.url);
      log(`下载分片 ${i+1}/${selected.length}`);
      const data = await fetchFile(u);
      const fn = `seg${i}.ts`;
      await ff.writeFile(fn, data);
      fileList.push(fn);
    }
    // 生成concat列表
    const concatTxt = fileList.map(f=>`file '${f}'`).join("\n");
    await ff.writeFile("concat.txt", concatTxt);
    log("开始合并 + 转码 MP3 192k");
    await ff.exec(["-f","concat","-safe","0","-i","concat.txt","-c:a","libmp3lame","-b:a","192k","output.mp3"]);
    const out = await ff.readFile("output.mp3");
    const blob = new Blob([out],{type:"audio/mpeg"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "output.mp3";
    a.click();
    log("✅ 转码完成，已自动下载MP3");
  }catch(e){
    log(`❌ 失败：${e.message}`);
    console.error(e);
  }finally{
    startBtn.disabled = false;
  }
}

function downloadLog(){
  const blob = new Blob([logText],{type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "log.txt";
  a.click();
}

function clearAll(){
  rawEl.value = "";
  slices = [];
  sliceListEl.innerHTML = "";
  logText = "";
  progressBar.style.width = "0%";
  statusTxt.innerText = "等待解析";
  startBtn.disabled = true;
}
window.parseM3U8 = parseM3U8;
window.clearAll = clearAll;
window.startConvert = startConvert;
window.downloadLog = downloadLog;
</script>
</body>
</html>
