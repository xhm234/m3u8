<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M3U8 编辑器 a-Shell base64单行版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#12121a;color:#eee;padding:12px;line-height:1.5}
.box{background:#1e1e2f;border-radius:10px;padding:14px;margin-bottom:12px}
h3{margin-bottom:10px;color:#7cf}
input,textarea,select,button{width:100%;padding:10px;border-radius:6px;border:0;font-size:15px;margin:6px 0}
input,textarea,select{background:#2b2b40;color:#fff}
button{background:#2584ff;color:#fff;font-weight:bold;cursor:pointer}
button.secondary{background:#444660}
button.danger{background:#c43}
.row{display:flex;gap:8px}
.row>*{flex:1}
pre{background:#0b0b16;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;color:#9cf;white-space:pre-wrap;word-break:break-all}
.tip{color:#aaa;font-size:13px;margin:4px 0}
#previewVideo{max-width:100%;border-radius:8px;background:#000}
.sliceItem{display:flex;align-items:center;gap:6px;padding:8px;background:#2b2b40;border-radius:6px;margin:4px 0}
.sliceItem>input{flex:0 0 40px}
.sliceItem>span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="box">
<h3>全局 BaseURL（必填）</h3>
<input id="baseUrl" placeholder="https://xxx.com/stream/">
<div class="tip">同站点多段合并只填一次，自动拼接分片相对地址</div>
</div>

<div class="box">
<h3>输出设置（a-Shell）</h3>
<div class="row">
<div>
<label class="tip">输出目录</label>
<input id="outDir" value="Documents" placeholder="Documents">
</div>
<div>
<label class="tip">输出文件名（不带后缀）</label>
<input id="outName" value="audio_out" placeholder="audio_out">
</div>
</div>
<div class="row">
<div>
<label class="tip">输出格式</label>
<select id="fmtSel">
<option value="mp4">MP4（视频 copy）</option>
<option value="mp3">MP3（提取音频）</option>
</select>
</div>
<div>
<label class="tip">MP3码率</label>
<select id="abrSel">
<option value="128k">128k</option>
<option value="192k" selected>192k</option>
<option value="256k">256k</option>
<option value="320k">320k</option>
</select>
</div>
</div>
<div class="tip">Base64单行命令，a-Shell粘贴不会逐行执行，无EOF问题</div>
</div>

<div class="box">
<h3>导入 M3U8</h3>
<textarea id="m3u8Raw" rows="6" placeholder="粘贴 m3u8 文本内容"></textarea>
<div class="row">
<button onclick="parseM3U8()">解析分片</button>
<button class="secondary" onclick="clearAll()">清除全部</button>
</div>
<div class="tip">清单预览：只勾选需要的分片</div>
</div>

<div class="box">
<h3>分片列表（勾选删减分片）<span class="tip" id="sliceStat"></span></h3>
<div id="sliceList"></div>
<div class="row" style="margin-top:8px">
<button onclick="exportM3u8()">导出m3u8文件（备用）</button>
<button class="secondary" onclick="genShellCmd()">生成 a-Shell 单行命令</button>
</div>
</div>

<div class="box">
<h3>预览</h3>
<video id="previewVideo" controls></video>
<div class="tip">Safari点击播放自动全屏</div>
</div>

<div class="box">
<h3>生成命令（整条只有一行，直接复制粘贴）</h3>
<pre id="cmdOut"></pre>
<div class="row">
<button onclick="copyCmd()">复制命令</button>
<button class="secondary" onclick="sendSave()">提交到 127.0.0.1:8001/save</button>
</div>
</div>

<script>
let slices = [];
const baseUrlEl = document.getElementById('baseUrl');
const rawEl = document.getElementById('m3u8Raw');
const sliceListEl = document.getElementById('sliceList');
const sliceStatEl = document.getElementById('sliceStat');
const cmdOutEl = document.getElementById('cmdOut');
const previewVid = document.getElementById('previewVideo');
const outDirEl = document.getElementById('outDir');
const outFileEl = document.getElementById('outName');
const fmtSel = document.getElementById('fmtSel');
const abrSel = document.getElementById('abrSel');

function parseM3U8(){
    const raw = rawEl.value.trim();
    if(!raw) return alert("请粘贴 m3u8 内容");
    slices = [];
    const lines = raw.split(/\r?\n/);
    let currentExtinf = null;
    for(const line of lines){
        const t = line.trim();
        if(!t) continue;
        if(t.startsWith("#")){
            if(t.startsWith("#EXTINF")) currentExtinf = t;
            slices.push({type:"tag", text:t});
        }else{
            slices.push({type:"segment", text:t, extinf:currentExtinf, url:t});
            currentExtinf = null;
        }
    }
    renderSliceList();
}

function renderSliceList(){
    sliceListEl.innerHTML = "";
    const segList = slices.filter(x=>x.type === "segment");
    segList.forEach((item,idx)=>{
        const div = document.createElement('div');
        div.className = "sliceItem";
        div.innerHTML = `
            <input type="checkbox" data-idx="${idx}" checked>
            <span>[${idx+1}] ${item.url}</span>
            <button class="secondary" style="width:70px;padding:4px;font-size:12px" onclick="previewSlice(${segList.indexOf(item)})">预览</button>
        `;
        sliceListEl.appendChild(div);
    })
    updateStat();
}

function updateStat(){
    const segList = slices.filter(x=>x.type === "segment");
    const checked = document.querySelectorAll('.sliceItem input:checked').length;
    sliceStatEl.textContent = `（总计：${segList.length} 条，已选中：${checked} 条）`;
}

function previewSlice(i){
    const segList = slices.filter(x=>x.type === "segment");
    const item = segList[i];
    const base = baseUrlEl.value.trim();
    let src;
    if(/^https?:\/\//.test(item.url)) src = item.url;
    else src = new URL(item.url, base).href;
    previewVid.src = src;
    previewVid.play();
}

function genShellCmd(){
    const segList = slices.filter(x=>x.type === "segment");
    const selectedIdx = [];
    document.querySelectorAll('.sliceItem input:checked').forEach(cb=>{
        selectedIdx.push(Number(cb.dataset.idx));
    });
    const selectedSeg = selectedIdx.map(i=>segList[i]);

    const outLines = [];
    for(const s of slices){
        if(s.type === "tag"){
            outLines.push(s.text);
        }else{
            if(selectedSeg.includes(s)) outLines.push(s.text);
        }
    }
    const m3u8Body = outLines.join("\n");
    // base64编码
    const b64 = btoa(unescape(encodeURIComponent(m3u8Body)));

    const dir = outDirEl.value.trim();
    const fname = outFileEl.value.trim();
    const fmt = fmtSel.value;
    const abr = abrSel.value;

    let ffmpegArg;
    if(fmt === "mp4"){
        ffmpegArg = `-c copy "${dir}/${fname}.mp4"`;
    }else{
        ffmpegArg = `-vn -c:a libmp3lame -b:a ${abr} "${dir}/${fname}.mp3"`;
    }
    // 单行命令
    const cmd = `echo '${b64}' | base64 -d | ffmpeg -i - ${ffmpegArg}`;
    cmdOutEl.innerText = cmd;
}

function exportM3u8(){
    const segList = slices.filter(x=>x.type === "segment");
    const selectedIdx = [];
    document.querySelectorAll('.sliceItem input:checked').forEach(cb=>{
        selectedIdx.push(Number(cb.dataset.idx));
    });
    const selectedSeg = selectedIdx.map(i=>segList[i]);
    const outLines = [];
    for(const s of slices){
        if(s.type === "tag") outLines.push(s.text);
        else{
            if(selectedSeg.includes(s)) outLines.push(s.text);
        }
    }
    const text = outLines.join("\n");
    const blob = new Blob([text],{type:"application/x-mpegURL"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "edited.m3u8";
    a.click();
}

function copyCmd(){
    const t = cmdOutEl.innerText;
    navigator.clipboard.writeText(t).then(()=>alert("✅ 已复制，整条一行粘贴到a-Shell直接回车执行"));
}

async function sendSave(){
    const t = cmdOutEl.innerText;
    try{
        const r = await fetch("http://127.0.0.1:8001/save",{
            method:"POST",
            body:t,
            headers:{"Content-Type":"text/plain"}
        });
        alert(await r.text());
    }catch(e){
        alert("提交失败："+e.message);
    }
}

function clearAll(){
    rawEl.value = "";
    slices = [];
    sliceListEl.innerHTML = "";
    sliceStatEl.textContent = "";
    cmdOutEl.innerText = "";
    previewVid.src = "";
}
window.parseM3U8 = parseM3U8;
window.clearAll = clearAll;
window.genShellCmd = genShellCmd;
window.copyCmd = copyCmd;
window.sendSave = sendSave;
window.previewSlice = previewSlice;
</script>
</body>
</html>
