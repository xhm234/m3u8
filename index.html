<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U8编辑器｜直转MP3（方案A直连 + 方案B代理）</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{max-width:920px;margin:16px auto;padding:12px}
textarea,input,button{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:6px}
textarea{width:100%;min-height:160px}
.area{border:1px solid #ddd;padding:14px;border-radius:8px;margin:12px 0}
.info{color:#666;font-size:14px;margin:4px 0}
.warn{color:#c00}
.ok{color:#080}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
#log{white-space:pre-wrap;font-size:13px;color:#333;background:#f8f8f8;padding:8px;max-height:220px;overflow:auto}
</style>
</head>
<body>
<h2>M3U8编辑器｜编辑后直接转MP3（不生成MP4）</h2>
<div class="info">提示：方案A=直连（CORS容易拦截）｜方案B=代理中转（需要你自己的CORS代理地址）</div>
<div class="area">
<h4>① 粘贴M3U8文本</h4>
<textarea id="m3u8Input" placeholder="粘贴抓包得到的完整m3u8内容"></textarea>
<div class="row">
<button onclick="parseM3u8()">解析 & 提取分片</button>
<button onclick="clearAll()">清空</button>
</div>
<div id="parseInfo" class="info"></div>
<textarea id="listOut" readonly placeholder="分片列表，可手动删除不需要的行"></textarea>
</div>

<div class="area">
<h4>② 方案A：直连下载分片 + 合并转MP3</h4>
<div class="info warn">⚠️ 爱奇艺CDN会CORS拦截，仅适合允许跨域的公开流</div>
<button onclick="startConvertDirect()">方案A：开始直连转MP3</button>
</div>

<div class="area">
<h4>③ 方案B：代理中转下载分片 + 合并转MP3</h4>
<div class="info">代理格式示例：https://xxx.deno.dev（末尾不要斜杠），拼接规则：代理地址/分片URL</div>
<div class="row">
<input id="proxyUrl" placeholder="填入你的CORS代理地址" style="flex:1">
</div>
<button onclick="startConvertProxy()">方案B：代理中转转MP3</button>
</div>

<div class="area">
<h4>运行日志</h4>
<div id="log"></div>
</div>

<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let chunkUrls = [];
const logDom = document.getElementById('log');

function log(txt){
    const t = new Date().toLocaleTimeString();
    logDom.innerText += `[${t}] ${txt}\n`;
    logDom.scrollTop = logDom.scrollHeight;
}

function parseM3u8(){
    const text = document.getElementById('m3u8Input').value;
    const lines = text.split('\n');
    chunkUrls = [];
    for(let line of lines){
        line = line.trim();
        if(line.startsWith('http')) chunkUrls.push(line);
    }
    document.getElementById('listOut').value = chunkUrls.join('\n');
    document.getElementById('parseInfo').innerText = `解析完成，分片数量：${chunkUrls.length}`;
    log(`解析分片成功，共 ${chunkUrls.length} 条`);
}

function clearAll(){
    document.getElementById('m3u8Input').value = '';
    document.getElementById('listOut').value = '';
    document.getElementById('parseInfo').innerText = '';
    logDom.innerText = '';
    chunkUrls = [];
}

async function loadFFmpeg(){
    if(ffmpeg) return;
    log('正在加载FFmpeg.wasm内核...首次加载约30MB，请耐心等待');
    ffmpeg = new FFmpeg();
    ffmpeg.on('progress', ({ progress }) => {
        log(`转码进度：${(progress*100).toFixed(1)}%`);
    });
    await ffmpeg.load();
    log('FFmpeg内核加载完毕');
}

async function downloadBlob(url){
    const resp = await fetch(url);
    if(!resp.ok) throw new Error(`分片请求失败，状态码:${resp.status}`);
    return new Uint8Array(await resp.arrayBuffer());
}

async function startConvertDirect(){
    await runConvert(null);
}
async function startConvertProxy(){
    const proxyBase = document.getElementById('proxyUrl').value.trim();
    if(!proxyBase){
        alert('请填写代理地址');
        return;
    }
    await runConvert(proxyBase);
}

async function runConvert(proxyBase){
    const listText = document.getElementById('listOut').value.trim();
    if(!listText){
        alert('请先解析m3u8');
        return;
    }
    const urls = listText.split('\n').filter(s=>s.trim());
    await loadFFmpeg();
    log('开始下载分片...');
    const parts = [];
    for(let i=0;i<urls.length;i++){
        let u = urls[i].trim();
        let fetchUrl = u;
        if(proxyBase){
            fetchUrl = proxyBase + '/' + encodeURIComponent(u);
        }
        log(`正在下载分片 ${i+1}/${urls.length}`);
        const buf = await downloadBlob(fetchUrl);
        const fname = `part${i}.ts`;
        await ffmpeg.writeFile(fname, buf);
        parts.push(fname);
    }
    log('分片全部下载完成，开始合并并提取音频转MP3');
    let concatTxt = '';
    for(let p of parts) concatTxt += `file '${p}'\n`;
    await ffmpeg.writeFile('concat.txt', concatTxt);
    await ffmpeg.exec(['-f','concat','-safe','0','-i','concat.txt','-vn','-c:a','libmp3lame','-b:a','192k','output.mp3']);
    const mp3Data = await ffmpeg.readFile('output.mp3');
    const blob = new Blob([mp3Data],{type:'audio/mpeg'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'output.mp3';
    a.click();
    log('✅ MP3生成完成，自动触发下载');
}
</script>
</body>
</html>
