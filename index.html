<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M3U8 网页工具</title>
<script src="https://fastly.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f3f5; color: #1f2329; padding-bottom: 120px; }
.header { background: linear-gradient(135deg,#3370ff,#2850c8); color:#fff; padding: 18px 16px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header p { font-size: 12px; opacity: .85; margin-top: 4px; }
.container { padding: 12px; }
.card { background:#fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card h2 { font-size: 15px; margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
textarea { width:100%; min-height: 120px; border:1px solid #dcdfe6; border-radius: 8px; padding: 10px; font-size: 13px; font-family: monospace; resize: vertical; line-height: 1.5; }
textarea:focus { outline: none; border-color: #3370ff; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
.btn:active { opacity: .8; }
.btn-primary { background:#3370ff; color:#fff; }
.btn-secondary { background:#f0f2f5; color:#1f2329; }
.btn-danger { background:#ff4d4f; color:#fff; }
.btn-success { background:#34c759; color:#fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display:flex; gap:8px; flex-wrap: wrap; margin-top: 10px; }
.btn-row .btn { flex:1; min-width: 110px; }
.video-wrap { width:100%; background:#000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
video { width:100%; display:block; max-height: 320px; }
.meta { font-size: 12px; color:#646a73; margin-top: 8px; line-height: 1.7; }
.seg-list { margin-top: 10px; display:flex; flex-direction: column; gap: 8px; }
.seg-item { display:flex; align-items:center; gap:10px; padding: 10px 12px; background:#f7f8fa; border-radius: 10px; }
.seg-item.off { opacity: .4; }
.seg-item input[type=checkbox] { width:18px; height:18px; accent-color:#3370ff; flex-shrink:0; }
.seg-info { flex:1; min-width:0; }
.seg-name { font-size: 13px; font-weight: 500; }
.seg-meta { font-size: 11px; color:#646a73; margin-top: 2px; word-break: break-all; }
.seg-del { background:#ffece8; color:#ff4d4f; border:none; border-radius:8px; padding:6px 10px; font-size:12px; }
.status { font-size:13px; line-height: 1.6; padding: 10px; border-radius: 8px; margin-top: 10px; background:#f7f8fa; display:none; }
.status.show { display:block; }
.status.ok { background:#e8f7ec; color:#1a7f37; }
.status.err { background:#ffece8; color:#c8272c; }
.status.load { background:#eaf3ff; color:#2850c8; }
.output-box { background:#1f2329; color:#e5e6eb; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow-y: auto; line-height: 1.6; }
.tip { font-size: 12px; color:#8f959e; line-height: 1.7; margin-top: 8px; }
.toolbar { display:flex; gap:6px; flex-wrap: wrap; margin-top: 10px; }
.toolbar .btn { padding: 8px 12px; font-size: 12px; border-radius: 8px; }
.hl { color:#3370ff; }
.section-title { font-size: 13px; color:#646a73; margin: 12px 0 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>📼 M3U8 网页处理工具</h1>
  <p>手机浏览器可用 · 解析 / 预览 / 剪辑 / 导出 MP3</p>
</div>

<div class="container">

  <!-- 1. 粘贴 m3u8 -->
  <div class="card">
    <h2>① 粘贴 M3U8 内容</h2>
    <textarea id="m3u8Input" placeholder="把完整 #EXTM3U ... #EXT-X-ENDLIST 内容粘贴到这里，或点击「选择文件」读取本地 .m3u8 文件"></textarea>
    <div class="toolbar">
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📂 选择文件</button>
      <button class="btn btn-primary" onclick="parseM3U8()">🔍 解析分片</button>
      <button class="btn btn-secondary" onclick="loadDemo()">示例数据</button>
      <input type="file" id="fileInput" accept=".m3u8,.txt,.hls" style="display:none" onchange="readFile(event)">
    </div>
    <div class="status" id="parseStatus"></div>
  </div>

  <!-- 2. 预览 -->
  <div class="card" id="previewCard" style="display:none">
    <h2>② 在线预览</h2>
    <div class="video-wrap">
      <video id="player" controls playsinline></video>
    </div>
    <div class="meta" id="previewMeta"></div>
    <div class="tip">提示：若预览黑屏 / 报错，多为跨域限制或链接已失效；不影响下方编辑与导出。</div>
  </div>

  <!-- 3. 分片编辑 -->
  <div class="card" id="segCard" style="display:none">
    <h2>③ 分片列表（取消勾选即剔除）</h2>
    <div class="toolbar">
      <button class="btn btn-secondary" onclick="toggleAll(true)">全选</button>
      <button class="btn btn-secondary" onclick="toggleAll(false)">全不选</button>
      <button class="btn btn-danger" onclick="removeUnchecked()">删除未选中</button>
    </div>
    <div class="seg-list" id="segList"></div>
  </div>

  <!-- 4. 导出 -->
  <div class="card" id="exportCard" style="display:none">
    <h2>④ 导出结果</h2>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="buildOutput()">📝 生成新 M3U8</button>
      <button class="btn btn-success" onclick="exportM3U8()">⬇️ 下载 M3U8 文件</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="mp3Btn" onclick="extractMp3()">🎵 提取 MP3（本地转码）</button>
      <button class="btn btn-secondary" onclick="copyOutput()">📋 复制结果</button>
    </div>
    <div class="tip">⚠️ 提取 MP3 需通过 HTTP 网页访问（双击本地 HTML 为 file:// 时，浏览器禁止转码引擎加载）；M3U8 解析、预览、剪辑、导出在本地均可正常使用。</div>
    <div class="status" id="exportStatus"></div>
    <div class="section-title">生成内容：</div>
    <div class="output-box" id="outputBox">（点击「生成新 M3U8」后显示）</div>
  </div>

</div>

<script>
// ============ 全局状态 ============
let segments = [];        // { duration, url, selected, extinf }
let hls = null;
let ffmpeg = null;

// ============ 文件读取 ============
function readFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById('m3u8Input').value = r.result; };
  r.readAsText(f);
}

// ============ 解析 m3u8 ============
function parseM3U8() {
  const text = document.getElementById('m3u8Input').value.trim();
  const st = document.getElementById('parseStatus');
  if (!text) { showStatus(st, 'err', '请先粘贴 M3U8 内容'); return; }
  segments = [];
  const lines = text.split(/\r?\n/);
  let curDuration = 0, curExtinf = '';
  let baseUrl = '';
  for (let i=0; i<lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('#EXT-X-TARGETDURATION')) continue;
    if (line.startsWith('#EXT-X-DISCONTINUITY')) continue;
    if (line.startsWith('#EXT-X-ENDLIST')) continue;
    if (line.startsWith('#EXT-X-KEY')) continue;
    if (line.startsWith('#EXT-X-MEDIA')) continue;
    if (line.startsWith('#EXTINF:')) {
      curExtinf = line;
      const m = line.match(/#EXTINF:([\d.]+)/);
      curDuration = m ? parseFloat(m[1]) : 0;
      continue;
    }
    if (line.startsWith('#')) continue;
    // 普通 URL
    segments.push({
      duration: curDuration,
      extinf: curExtinf || `#EXTINF:${curDuration},`,
      url: line,
      selected: true
    });
    curDuration = 0; curExtinf = '';
  }
  if (segments.length === 0) { showStatus(st, 'err', '未解析到分片 URL，请检查格式'); return; }
  renderSegments();
  showStatus(st, 'ok', `解析成功：共 ${segments.length} 个分片，总时长约 ${totalDuration().toFixed(1)} 秒`);
  document.getElementById('segCard').style.display = 'block';
  document.getElementById('exportCard').style.display = 'block';
  loadPreview();
}

function totalDuration() {
  return segments.filter(s=>s.selected).reduce((a,s)=>a+s.duration,0);
}

// ============ 渲染分片 ============
function renderSegments() {
  const list = document.getElementById('segList');
  list.innerHTML = '';
  segments.forEach((seg, idx) => {
    const div = document.createElement('div');
    div.className = 'seg-item' + (seg.selected ? '' : ' off');
    const shortUrl = seg.url.length > 60 ? seg.url.slice(0,60)+'…' : seg.url;
    div.innerHTML = `
      <input type="checkbox" ${seg.selected?'checked':''} onchange="toggleSeg(${idx}, this.checked)">
      <div class="seg-info">
        <div class="seg-name">#${idx+1} · ${seg.duration}s</div>
        <div class="seg-meta">${shortUrl}</div>
      </div>
      <button class="seg-del" onclick="removeSeg(${idx})">删除</button>`;
    list.appendChild(div);
  });
  document.getElementById('previewMeta').textContent = `当前选中 ${segments.filter(s=>s.selected).length} / ${segments.length} 段，约 ${totalDuration().toFixed(1)} 秒`;
}

function toggleSeg(idx, checked) { segments[idx].selected = checked; renderSegments(); }
function toggleAll(v) { segments.forEach(s=>s.selected=v); renderSegments(); }
function removeSeg(idx) { segments.splice(idx,1); renderSegments(); }
function removeUnchecked() { segments = segments.filter(s=>s.selected); renderSegments(); }

// ============ 预览（Blob m3u8） ============
function loadPreview() {
  const player = document.getElementById('player');
  const m3u8Text = buildM3U8Text();
  const blob = new Blob([m3u8Text], {type:'application/vnd.apple.mpegurl'});
  const url = URL.createObjectURL(blob);
  document.getElementById('previewCard').style.display = 'block';
  if (hls) { hls.destroy(); hls = null; }
  if (Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(player);
    hls.on(Hls.Events.ERROR, (e,data)=>{
      if (data.fatal) showStatus(document.getElementById('parseStatus'), 'err', '预览失败：跨域或链接失效（不影响导出）');
    });
  } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
    player.src = url;
  }
}

// ============ 生成 m3u8 文本 ============
function buildM3U8Text() {
  const lines = ['#EXTM3U', '#EXT-X-TARGETDURATION:10'];
  segments.forEach(s => {
    if (!s.selected) return;
    lines.push(s.extinf);
    lines.push(s.url);
  });
  lines.push('#EXT-X-ENDLIST');
  return lines.join('\n');
}

function buildOutput() {
  const text = buildM3U8Text();
  document.getElementById('outputBox').textContent = text;
  showStatus(document.getElementById('exportStatus'), 'ok', `已生成 ${segments.filter(s=>s.selected).length} 段的 M3U8`);
}

function exportM3U8() {
  const text = buildM3U8Text();
  const blob = new Blob([text], {type:'application/vnd.apple.mpegurl'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'edited.m3u8';
  a.click();
}

function copyOutput() {
  const text = buildM3U8Text();
  navigator.clipboard.writeText(text).then(()=>{
    showStatus(document.getElementById('exportStatus'), 'ok', '已复制到剪贴板');
  }).catch(()=>{
    // 兜底
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    showStatus(document.getElementById('exportStatus'), 'ok', '已复制到剪贴板');
  });
}

// ============ 提取 MP3（ffmpeg.wasm） ============
// ESM 模块 + Blob worker + Blob core/wasm，绕过跨域 Worker / import 限制
async function loadFFmpeg() {
  if (ffmpeg) return ffmpeg;
  const cdn = 'https://fastly.jsdelivr.net/npm/@ffmpeg';
  // 1) 拉 esm worker，相对 import 改写为 CDN 绝对路径
  let workerCode = await (await fetch(`${cdn}/ffmpeg@0.12.10/dist/esm/worker.js`)).text();
  workerCode = workerCode.replace(/from "\.\/([^"]+)"/g, `from "${cdn}/ffmpeg@0.12.10/dist/esm/$1"`);
  const workerBlob = URL.createObjectURL(new Blob([workerCode], {type:'application/javascript'}));
  // 2) core esm 脚本 + wasm 转 Blob
  const coreCode = await (await fetch(`${cdn}/core@0.12.10/dist/esm/ffmpeg-core.js`)).text();
  const coreBlob = URL.createObjectURL(new Blob([coreCode], {type:'text/javascript'}));
  const wasmBody = await (await fetch(`${cdn}/core@0.12.10/dist/esm/ffmpeg-core.wasm`)).blob();
  const wasmBlob = URL.createObjectURL(new Blob([wasmBody], {type:'application/wasm'}));
  // 3) 动态加载 ffmpeg ESM 主模块
  const { FFmpeg } = await import(`${cdn}/ffmpeg@0.12.10/dist/esm/index.js`);
  ffmpeg = new FFmpeg();
  await ffmpeg.load({ classWorkerURL: workerBlob, coreURL: coreBlob, wasmURL: wasmBlob });
  return ffmpeg;
}

async function extractMp3() {
  const st = document.getElementById('exportStatus');
  const btn = document.getElementById('mp3Btn');
  const selected = segments.filter(s=>s.selected);
  if (!selected.length) { showStatus(st,'err','没有选中分片'); return; }
  // file:// 本地双击打开：浏览器禁止 Worker 加载跨域 wasm/ESM，直接给出明确提示
  if (location.protocol === 'file:') {
    showStatus(st, 'err', '⚠️ 本地文件方式无法运行转码引擎：浏览器禁止 file:// 下的 Worker 加载 wasm。请用本页面的在线链接打开（或把 HTML 放到任意 HTTP 服务下访问），MP3 提取即可使用。');
    return;
  }
  btn.disabled = true;
  showStatus(st, 'load', '正在加载本地转码引擎（首次约 10-20 秒）…');
  try {
    const ffmpeg = await loadFFmpeg();
    const inputs = [];
    // 逐个下载分片为二进制，写入虚拟 FS
    for (let i=0; i<selected.length; i++) {
      showStatus(st, 'load', `下载分片 ${i+1}/${selected.length} …`);
      let resp;
      try {
        resp = await fetch(selected[i].url);
      } catch (e) {
        throw new Error(`分片 ${i+1} 被浏览器拦截（跨域/CORS），无法下载`);
      }
      if (!resp.ok) throw new Error(`分片 ${i+1} 请求失败 HTTP ${resp.status}（鉴权失效或链接已过期）`);
      const buf = await resp.arrayBuffer();
      const fname = `seg${i}.ts`;
      await ffmpeg.writeFile(fname, new Uint8Array(buf));
      inputs.push(fname);
    }
    // 写 concat 列表
    const concat = inputs.map(f=>`file '${f}'`).join('\n');
    await ffmpeg.writeFile('list.txt', concat);
    showStatus(st, 'load', '正在合并并转码 MP3 …');
    await ffmpeg.exec(['-f','concat','-safe','0','-i','list.txt','-vn','-c:a','libmp3lame','-b:a','128k','audio.mp3']);
    const data = await ffmpeg.readFile('audio.mp3');
    const blob = new Blob([data.buffer], {type:'audio/mpeg'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'audio.mp3';
    a.click();
    showStatus(st, 'ok', '✅ MP3 已生成并开始下载');
  } catch (err) {
    console.error(err);
    const reason = (err && err.message) ? err.message : '未知错误（引擎加载被浏览器拦截）';
    showStatus(st, 'err', '❌ 失败：' + reason + '。提示：转码需通过 HTTP 网页访问，且源分片需允许跨域；否则可导出 M3U8 后用本地播放器提取音频。');
  } finally {
    btn.disabled = false;
  }
}

// ============ 工具 ============
function showStatus(el, type, msg) {
  el.className = 'status show ' + type;
  el.textContent = msg;
}

function loadDemo() {
  document.getElementById('m3u8Input').value = `#EXTM3U
#EXT-X-TARGETDURATION:10
#EXTINF:10.000,
https://test-streams.mux.dev/x36xhzz/url_2/url_526/193039199_mp4_h264_aac_ld_7.ts
#EXTINF:10.000,
https://test-streams.mux.dev/x36xhzz/url_2/url_527/193039199_mp4_h264_aac_ld_7.ts
#EXTINF:10.000,
https://test-streams.mux.dev/x36xhzz/url_2/url_528/193039199_mp4_h264_aac_ld_7.ts
#EXT-X-ENDLIST`;
}
</script>
</body>
</html>
